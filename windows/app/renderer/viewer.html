<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: http:; font-src 'self' data: https:; media-src https:; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>E-Mail</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--card); }
    #viewer { display: flex; flex-direction: column; height: 100vh; }
    #viewer .detail-bar { flex-wrap: wrap; }
    #viewer .body-frame, #viewer .body-text { flex: 1; min-height: 0; }
    #viewer .body-text { overflow: auto; margin: 0; }
    .v-msg { padding: 40px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div id="viewer"><div class="v-msg">Wird geladen …</div></div>
  <script src="viewer.js"></script>
</body>
</html>
