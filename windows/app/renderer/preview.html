<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src file: 'self'; object-src file:">
  <title>Druckvorschau</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #525659; }
    #pv { display: flex; flex-direction: column; height: 100vh; }
    .pv-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .pv-bar .sep { flex: 1; }
    .pv-bar .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .pv-bar .seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; }
    .pv-bar .seg button.on { background: var(--accent); color: #fff; }
    .pv-bar label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .pv-bar select, .pv-bar input[type=number] { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    .pv-bar input[type=number] { width: 56px; }
    .pv-bar select { width: auto !important; min-width: 0; }
    .pv-bar label { white-space: nowrap; }
    #printer { max-width: 280px; }
    .pv-bar .primary { padding: 6px 18px; }
    .pv-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
    #pdf { flex: 1; border: 0; width: 100%; background: #525659; }
    .pv-msg { color: #fff; padding: 40px; text-align: center; }
    #status { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="pv">
    <div class="pv-bar">
      <span class="pv-title" id="title">Druckvorschau</span>
      <span class="sep"></span>
      <span class="seg" title="Seitenausrichtung">
        <button id="portrait" class="on">Hochformat</button><button id="landscape">Querformat</button>
      </span>
      <button class="btn" id="save" title="Als PDF-Datei speichern (Strg+S)">PDF speichern …</button>
      <button class="btn" id="close" title="Schließen (Esc)">Schließen</button>
    </div>
    <div class="pv-bar">
      <label>Drucker <select id="printer"><option>wird geladen …</option></select></label>
      <label>Kopien <input type="number" id="copies" min="1" max="99" value="1"></label>
      <label>Seiten <select id="range"><option value="all">Alle</option><option value="part">Von – bis</option></select></label>
      <span id="rangeBox" style="display:none"><input type="number" id="from" min="1" value="1"> – <input type="number" id="to" min="1" value="1"></span>
      <label>Farbe <select id="color"><option value="1">Farbe</option><option value="0">Schwarzweiß</option></select></label>
      <label><input type="checkbox" id="duplex"> Beidseitig</label>
      <span class="sep"></span>
      <span id="status"></span>
      <button class="primary" id="print" title="Auf dem gewählten Drucker drucken (Strg+P)">Drucken</button>
    </div>
    <iframe id="pdf" title="Seitenansicht"></iframe>
  </div>
  <script src="preview.js"></script>
</body>
</html>
